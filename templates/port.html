<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Порт</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

{% include "header.html" %}

<div class="game-container">

<div class="port-box">

<p style="font-size:31px; font-weight:bold;">
    <b>Уровень:</b> {{ level }}
</p>

    </br>


    <div style="width:100%;background:#333;border-radius:8px;">
        <div style="width:{{ xp }}%;height:18px;background:dodgerblue;border-radius:8px;"></div>
    </div>

    <br>

    <div style="display:flex;justify-content:space-between;align-items:center;
font-size:28px;font-weight:bold;color:white;margin:3px 0;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
    
</div>
</div>

    <br>

    <img src="{{ url_for('static', filename='images/port.jpg') }}"
         class="port-image">

    <br><br>

    <button onclick="location.href='/sea'">🌊 В море</button>

<button onclick="location.href='/battle'">⚔️ Битвы</button>

<button onclick="location.href='/monsters'">👹 Монстры</button>

<button onclick="location.href='/poseidon'">🔱 Трезубец Посейдона</button>

<hr>

<button onclick="location.href='/market'">🛒 Рынок</button>

<button onclick="location.href='/shipyard'">⚓ Верфь</button>

<button onclick="location.href='/tavern'">🍺 Таверна</button>

<button onclick="location.href='/quests'">📜 Задания</button>
</a>


</div>
</div>

<div class="bottom-menu">

    <a href="/captain" class="bottom-btn">
        <div class="bottom-icon">👤</div>
        <div class="bottom-text">Капитан</div>
    </a>

    <a href="/fleet" class="bottom-btn">
        <div class="bottom-icon">⛵</div>
        <div class="bottom-text">Флот</div>
    </a>

    <div class="online-bar">
        <span>🟢 В игре: 1 игроков</span>
        <a href="/players">🔎 Поиск игроков</a>
    </div>

</div>

<script>
function updateOnlineCount() {
    fetch("/online_count")
        .then(response => response.json())
        .then(data => {
            document.getElementById("players-online").textContent = data.count;
        })
        .catch(error => {
            console.log("Ошибка получения онлайна:", error);
        });
}

function sendHeartbeat() {
    fetch("/heartbeat", {
        method: "POST"
    })
    .catch(error => {
        console.log("Ошибка heartbeat:", error);
    });
}

// Сразу при открытии страницы
updateOnlineCount();
sendHeartbeat();

// Обновляем количество игроков каждые 10 секунд
setInterval(updateOnlineCount, 10000);

// Сообщаем серверу, что игрок онлайн, каждые 20 секунд
setInterval(sendHeartbeat, 20000);
</script>

</div>

</body>
</html>
