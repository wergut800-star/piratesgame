<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title> Открытое море</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

{% include "header.html" %}

<div class="game-container">

<div class="port-box">


<img src="{{ url_for('static', filename='images/sea.jpg') }}" class="port-image">

<div class="sea-map">

    <h2> Карта Карибского моря</h2>

<div class="location-list">

    {% for loc in locations %}

    <div class="location {% if loc.available %}location-open{% else %}location-locked{% endif %}">

        ☠️ <b>{{ loc.name }}</b>

        {% if loc.available %}

            <small>Доступен</small>

            <a href="/travel/{{ loop.index0 }}">
                <button>⚓ Отправиться</button>
            </a>

        {% else %}

            <small>Требуемый уровень: {{ loc.level }}</small>

        {% endif %}

    </div>

    {% endfor %}

</div>

    

    
</div>



    <button onclick="location.href='/port'">
        ⚓ Вернуться в порт
    </button>

</div>
</div>

</body>
</html>
